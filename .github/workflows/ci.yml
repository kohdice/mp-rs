name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel pushes to main: a cancelled run exits before the caches are saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Limit debug info to line tables to keep target/ small. Does not affect the local Cargo.toml.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"
jobs:
  ci:
    name: Checks and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The runner context is not available in workflow- or job-level env, so export it from a step.
      - name: Resolve Nix binary cache directory
        run: echo "NIX_CACHE_DIR=${RUNNER_TEMP}/nix-binary-cache" >> "$GITHUB_ENV"
      - name: Install Nix
        uses: NixOS/nix-installer-action@00b25e1d0d56f56e90ee9814fb4385c721348f74 # main: 2026-07-05
        with:
          installer-version: 2.34.6
          # Use substitution to fetch required store paths on demand; `nix copy --all`
          # would import every cached path.
          extra-conf: |
            extra-substituters = file://${{ runner.temp }}/nix-binary-cache?trusted=true&priority=10
      - name: Restore Nix binary cache
        id: nix-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NIX_CACHE_DIR }}
          key: nix-v1-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
      - name: Build development shell
        run: nix develop --command true
      # On a cache miss only, export the flake inputs and the devShell closure to a local binary cache.
      # actions/cache compresses with zstd, so store uncompressed here to avoid double compression.
      - name: Export Nix store paths to the binary cache
        if: github.ref == 'refs/heads/main' && steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          nix flake archive --to "file://${NIX_CACHE_DIR}?compression=none"
          nix copy --to "file://${NIX_CACHE_DIR}?compression=none" .#devShells.x86_64-linux.default
          du -sh "${NIX_CACHE_DIR}"
      - name: Save Nix binary cache
        if: github.ref == 'refs/heads/main' && steps.nix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NIX_CACHE_DIR }}
          key: ${{ steps.nix-cache.outputs.cache-primary-key }}
      # registry/src is not cached because Cargo re-extracts it from registry/cache (Cargo Book guidance).
      # No restore-keys: prefix matches would carry stale artifacts forward and target/ would grow unbounded.
      - name: Restore Cargo artifacts
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      # Recipes live in the justfile; keep them in sync with "Build Commands" in AGENTS.md.
      - name: Fast checks
        run: nix develop --command just check-ci
      - name: Run tests
        run: nix develop --command just test
      # Workspace crates are rebuilt on every PR anyway, so drop their artifacts before saving.
      - name: Prune workspace artifacts before caching
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          nix develop --command bash -c '
            cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[].name" \
              | xargs -I{} cargo clean -p {}
          '
          du -sh target ~/.cargo/registry
      - name: Save Cargo artifacts
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
