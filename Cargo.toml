[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["kohdice <k@kohdice.com>"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/kohdice/mp-rs"

[workspace.dependencies]
mp-preview = { path = "crates/mp-preview" }

clap = { version = "4.6.7", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
comrak = { version = "0.56.0", default-features = false }
entities = "1.0.1"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
terminal_size = "0.4.4"
thiserror = "2.0.21"
two-face = { version = "0.5.2", default-features = false, features = [
    "syntect-default-fancy",
] }
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.2", default-features = false }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
mod_module_files = "deny"
