[workspace]
resolver = "3"
members = [
    "crates/mp",
    "crates/mp-ast",
    "crates/mp-parser",
    "crates/mp-renderer",
]

[workspace.package]
version = "0.1.0"
authors = ["kohdice <k@kohdice.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kohdice/mp-rs"

[workspace.dependencies]
mp-ast = { path = "crates/mp-ast" }
mp-parser = { path = "crates/mp-parser" }
mp-renderer = { path = "crates/mp-renderer" }

clap = { version = "4.6.1", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }
pulldown-cmark = { version = "0.13.3", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
